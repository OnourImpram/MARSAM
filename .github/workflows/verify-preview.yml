name: Verify preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Content, locale and root-path tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          npm run check 2>&1 | tee verification/check-root.log
      - name: Subpath tests and restore root build
        shell: bash
        run: |
          set -o pipefail
          BASE_PATH=/MARSAM/ npm run check 2>&1 | tee verification/check-subpath.log
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real HTTP browser checks
        run: |
          python tests/browser_e2e.py
          python tests/campus_e2e.py
      - name: Package source, preview and verification
        if: always()
        run: |
          mkdir -p /tmp/marsam-delivery
          git archive HEAD -o /tmp/marsam-delivery/source.tar
          git rev-parse HEAD > /tmp/marsam-delivery/commit.txt
          if [ -d dist ]; then cp -r dist /tmp/marsam-delivery/dist; fi
          if [ -d verification ]; then cp -r verification /tmp/marsam-delivery/verification; fi
          if [ -d .browser-results/live ]; then cp -r .browser-results/live /tmp/marsam-delivery/screenshots; fi
          if [ -d .browser-results/campus ]; then cp -r .browser-results/campus /tmp/marsam-delivery/campus-screenshots; fi
      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsam-preview
          path: /tmp/marsam-delivery/
          retention-days: 14
