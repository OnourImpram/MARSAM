# Publishes only the explicitly requested development preview, never a formal release.
name: Deploy MARSAM institutional preview
on:
  push:
    branches: [feat/multilingual-knowledge-platform]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marsam-pages-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'OnourImpram/MARSAM' && github.ref == 'refs/heads/feat/multilingual-knowledge-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /MARSAM/
      PAGES_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check content and GitHub Pages subpath routes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          npm run check 2>&1 | tee verification/pages-build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser dependencies
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Exercise the exact project-path artifact through real HTTP
        run: |
          python tests/browser_e2e.py
          python tests/campus_e2e.py
      - name: Bind preview artifact to the source commit
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='dist/build-manifest.json';
          const m=JSON.parse(await readFile(path,'utf8'));
          if(m.base!=='/MARSAM/'||m.mode!=='preview'||m.publicationAuthorized!==false||m.previewDeploymentAuthorized!==true)throw Error('Only the explicitly authorized draft can be deployed');
          m.deploymentCommit=process.env.GITHUB_SHA;
          await writeFile(path,JSON.stringify(m,null,2));
          JS
      - name: Upload generated site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Preserve real test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsam-pages-test-evidence
          path: verification
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read repository Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy the tested preview
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public URLs and the deployed commit
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const root=process.env.PREVIEW_URL;
          if(!root||!root.startsWith('https://'))throw Error('No HTTPS deployment URL returned');
          const base=root.endsWith('/')?root:root+'/';
          const get=async(path)=>{const r=await fetch(new URL(path,base),{signal:AbortSignal.timeout(30000),cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r;};
          let m;
          for(let i=0;i<12;i++){
            try{m=await(await get('build-manifest.json?commit='+process.env.GITHUB_SHA)).json();if(m.deploymentCommit===process.env.GITHUB_SHA)break;}catch(e){if(i===11)throw e;}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(m?.deploymentCommit!==process.env.GITHUB_SHA)throw Error('Public site does not match the deployed commit');
          for(const l of m.locales){
            for(const path of ['', 'collections/','compare/','events/']){
              const html=await(await get(l+'/'+path)).text();
              if(!html.includes('data-campus="marmara-preview"')||!html.includes('noindex'))throw Error('Preview identity missing '+l+'/'+path);
            }
          }
          for(const path of ['','assets/marmara-tr.png','assets/marmara-en.png','campus.css','campus.js'])await get(path);
          console.log(JSON.stringify({publicUrl:base,commit:m.deploymentCommit,checkedLocalizedPages:32,publicPreview:true,formalInstitutionalApproval:false}));
          JS
      - name: Record the public preview URL
        run: |
          echo '## MARSAM public development preview' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'The live HTML and manifest were checked after deployment. This is a draft, not formal institutional publication approval.' >> "$GITHUB_STEP_SUMMARY"
