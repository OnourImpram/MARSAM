name: Continuous portal acceptance
on:
  push:
    branches: [fix/continuous-portal-0101]
    paths: [.github/workflows/portal-hotfix.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 14
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove regression fails on unchanged 0.10.0
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p verification/portal-continuity
          python - <<'PY'
          import base64,lzma,hashlib,pathlib,subprocess
          p=lzma.decompress(base64.b64decode(pathlib.Path('.github/portal-hotfix/patch.xz.b64').read_text(),validate=True))
          assert hashlib.sha256(p).hexdigest()=='c0faad36c79a2120c5f192bb4d8013881cd2b97c5130b9cc7b044ec242d7e8d0'
          pathlib.Path('/tmp/portal.patch').write_bytes(p)
          subprocess.run(['git','apply','--check','/tmp/portal.patch'],check=True)
          subprocess.run(['git','apply','--include=tests/portal-continuity.test.mjs','/tmp/portal.patch'],check=True)
          PY
          if node --test tests/portal-continuity.test.mjs > verification/portal-continuity/red.log 2>&1; then
            echo 'Regression failed to detect the defective composition'; exit 1
          fi
          grep -F '# fail 2' verification/portal-continuity/red.log
      - name: Apply exact correction and verify both deployment roots
        shell: bash
        run: |
          set -euo pipefail
          git apply --exclude=tests/portal-continuity.test.mjs /tmp/portal.patch
          node scripts/portal-art.mjs
          BASE_PATH=/ npm run check > verification/portal-continuity/root.log 2>&1
          BASE_PATH=/MARSAM/ PAGES_PREVIEW=true npm run check > verification/portal-continuity/pages.log 2>&1
          node scripts/budget.mjs > verification/portal-continuity/budget.log
      - name: Prepare matching engines and glyph coverage
        run: |
          python -m pip install -q playwright==1.61.0 nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.30.1
          python scripts/test-fonts.py
      - name: Actual geometry, high-density mobile and full website regressions
        shell: bash
        run: |
          set -euo pipefail
          python tests/portal_pixels.py > verification/portal-continuity/pixels.log 2>&1 & p=$!
          python tests/browser_e2e.py > verification/portal-continuity/core.log 2>&1 & a=$!
          python tests/scope_e2e.py > verification/portal-continuity/scope.log 2>&1 & b=$!
          python tests/heritage_e2e.py > verification/portal-continuity/layout.log 2>&1 & c=$!
          timeout 420 python -u tests/research_e2e.py > verification/portal-continuity/research.log 2>&1 & d=$!
          python tests/cini_e2e.py > verification/portal-continuity/cini.log 2>&1 & e=$!
          python tests/scholarship_e2e.py > verification/portal-continuity/scholarship.log 2>&1 & f=$!
          python tests/evidence_cycle_e2e.py > verification/portal-continuity/evidence.log 2>&1 & g=$!
          python tests/research_artifacts.py > verification/portal-continuity/notebook.log 2>&1 & h=$!
          status=0
          for pid in $p $a $b $c $d $e $f $g $h; do wait "$pid" || status=1; done
          for log in verification/portal-continuity/*.log; do echo "$log"; tail -4 "$log"; done
          exit "$status"
      - name: Commit verified source without changing workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onour Impram'
          git config user.email 'onuribram@outlook.com'
          rm .github/portal-hotfix/patch.xz.b64
          git add AGENTS.md package.json public/site.css public/assets/heritage/portal-continuous-v1.svg scripts/portal-art.mjs src/editorial.mjs src/release.mjs tests docs/design/PORTAL_CONTINUITY_0_10_1.md .github/portal-hotfix/patch.xz.b64
          git diff --cached --check
          git commit -m 'fix: render portal as one continuous image without mobile patch seams'
          git push origin HEAD:fix/continuous-portal-0101
          git rev-parse HEAD > verification/portal-continuity/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-0101-acceptance
          path: |
            verification/portal-continuity/
            verification/*-browser.json
            verification/reading-room-*.json
          retention-days: 7
