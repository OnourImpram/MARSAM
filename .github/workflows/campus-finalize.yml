name: Verify and commit institutional preview
on:
  push:
    branches: [feat/multilingual-knowledge-platform]
    paths: [.github/workflows/campus-finalize.yml]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore byte-verified institutional source, not stale branch files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/OnourImpram/MARSAM/actions/artifacts/11165407466/zip > /tmp/campus.zip
          python - <<'PY'
          import hashlib,zipfile,pathlib
          p=pathlib.Path('/tmp/campus.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8e442b72ba25ca5afc98c9cf8ebd41019287332bc18da450fa3f3121f5a7a566'
          z=zipfile.ZipFile(p)
          for n in z.namelist():
            if n.startswith(('src/','public/','scripts/','tests/','docs/')) or n=='package.json':z.extract(n,'.')
          p=pathlib.Path('public/campus.css')
          p.write_text(p.read_text()+'''\n/* Regression fixes verified against real Chromium's intrinsic sizing.
             Closed native details content must not participate in page overflow. */
          .mobile-nav:not([open])>nav{display:none}
          @media(max-width:800px){.mobile-nav nav{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav-group{min-width:0}.mobile-nav-group a,.mobile-nav-group strong{overflow-wrap:anywhere}}
          @media(max-width:600px){.preview-strip .wide>span{flex:1;min-width:0}.preview-strip a{flex:0 0 86px;white-space:normal;gap:6px;line-height:1.5}.preview-strip a .icon{width:12px;flex-shrink:0}}
          ''')
          p=pathlib.Path('tests/campus_e2e.py');s=p.read_text()
          needle="                    if (path=='' and w in [390,1440])"
          replacement="""                    if path=='' and w<=768:
                                  menu=page.locator('.mobile-nav')
                                  ck(f'closed menu excluded from layout {l} {w}',not menu.locator('nav').is_visible())
                                  menu.locator('summary').click()
                                  ck(f'open mobile menu within viewport {l} {w}',page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'))
                                  menu.locator('summary').click()
                              if (path=='' and w in [390,1440])"""
          # Preserve Python block indentation after YAML removes its common prefix.
          replacement=replacement.replace('\n                                  ','\n                        ').replace('\n                              ','\n                    ')
          assert needle in s;p.write_text(s.replace(needle,replacement))
          PY
      - name: Restore bounded comparative research report
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const sha='741c3cd721c069aa4ff085f4669fe36c4ecfdec9';
            const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
            const b=Buffer.from(data.content,'base64');
            if(crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex')!==sha)throw Error('Document mismatch');
            fs.writeFileSync('docs/ACADEMIC_BENCHMARK_TR.md',b);
      - name: Verify root and project-path builds
        shell: bash
        run: |
          mkdir -p verification
          set -o pipefail
          npm run check 2>&1 | tee verification/campus-root.log
          BASE_PATH=/MARSAM/ npm run check 2>&1 | tee verification/campus-subpath.log
          npm run build
          python -m py_compile tests/campus_e2e.py
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Real HTTP browser verification, including regression cases
        run: |
          python tests/browser_e2e.py
          python tests/campus_e2e.py
      - name: Commit only tested source files to the feature branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/multilingual-knowledge-platform | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/campus*.mjs public/campus* public/assets/marmara-*.png scripts/build.mjs package.json tests/campus* tests/build.test.mjs docs/MARMARA_ASSETS.json docs/BENCHMARK_BROWSER_OBSERVATIONS.json docs/ACADEMIC_BENCHMARK_TR.md
          git commit -m 'feat: verified Marmara preview, academic collections, source comparison and event archive [skip ci]'
          git push origin HEAD:feat/multilingual-knowledge-platform
      - name: Package reproducible source and test evidence
        if: always()
        run: |
          mkdir -p /tmp/campus-delivery
          git archive HEAD -o /tmp/campus-delivery/source.tar
          git rev-parse HEAD > /tmp/campus-delivery/commit.txt
          cp -r src public scripts tests docs package.json /tmp/campus-delivery/
          if [ -d dist ]; then cp -r dist /tmp/campus-delivery/; fi
          if [ -d verification ]; then cp -r verification /tmp/campus-delivery/; fi
          if [ -d .browser-results/campus ]; then cp -r .browser-results/campus /tmp/campus-delivery/screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-marmara-preview
          path: /tmp/campus-delivery/
          retention-days: 14
