name: Prepare decorative image asset
on:
  push:
    branches: [design/editorial-finish-20261001]
    paths: [.github/workflows/design-asset.yml]
permissions:
  contents: read
jobs:
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download and optimize the identified Pexels photograph
        run: |
          python -m pip install -q pillow
          mkdir -p assets
          python - <<'PY'
          from urllib.request import urlopen,Request
          from io import BytesIO
          from PIL import Image
          from pathlib import Path
          import json,hashlib
          u='https://images.pexels.com/photos/12987590/pexels-photo-12987590.jpeg?auto=compress&cs=tinysrgb&w=1800'
          data=urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
          im=Image.open(BytesIO(data)).convert('RGB')
          for width in [640,1440]:
              copy=im.copy();copy.thumbnail((width,width))
              copy.save(f'assets/water-{width}.webp','WEBP',quality=84,method=6)
          Path('assets/provenance.json').write_text(json.dumps({'creator':'Engin Akyurt','source':'https://www.pexels.com/photo/blue-water-in-close-up-photography-12987590/','license':'https://www.pexels.com/license/','role':'Decorative water texture, not a photograph of MARSAM, a campus, research, staff or a therapeutic intervention.','checked':'2026-10-01','originalSHA256':hashlib.sha256(data).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marsam-decorative-water
          path: assets/
          retention-days: 7
