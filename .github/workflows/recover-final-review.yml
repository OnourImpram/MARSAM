name: Recover final scholarly patch
on:
  push:
    branches: [fix/scholarly-final-review-20261004]
    paths: [.github/workflows/recover-final-review.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode staged payload without executing it
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,subprocess
          out=Path('verification/recovered');out.mkdir(parents=True,exist_ok=True)
          parts=[Path(f'.github/final-review/patch{i}.b64').read_text().strip() for i in range(1,4)]
          data=base64.b64decode(''.join(parts),validate=True)
          decoded=lzma.decompress(data)
          (out/'patch.json').write_bytes(decoded)
          obj=json.loads(decoded)
          info={'encodedSha256':hashlib.sha256(data).hexdigest(),'decodedSha256':hashlib.sha256(decoded).hexdigest(),'type':type(obj).__name__,'bytes':len(decoded),'keys':list(obj)[:40] if isinstance(obj,dict) else None,'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          (out/'identity.json').write_text(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-scholarly-patch
          path: verification/recovered/
          retention-days: 14
