name: Materialize and verify eight-language preview
on:
  push:
    branches: [feat/multilingual-knowledge-platform]
    paths: [.github/workflows/materialize-locale-update.yml]
permissions:
  contents: write
concurrency:
  group: marsam-locale-materialization
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch and extract original translation keys
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor 15e15d87e234feebb9ce262a4a4eb9412e3792a5 HEAD
          node --input-type=module <<'JS'
          import {labels,sourceNotes} from './src/i18n.mjs';
          import * as c from './src/content.mjs';
          import * as a from './src/articles.mjs';
          import * as i from './src/info.mjs';
          import {writeFile} from 'node:fs/promises';
          const rows=[],seen=new Set();
          const add=v=>{if(!seen.has(v)){seen.add(v);rows.push(v);}};
          function walk(v){if(v&&typeof v==='object'){if(typeof v.en==='string'&&typeof v.tr==='string'){add(v.en);return;}for(const x of Object.values(v))walk(x);}}
          Object.values(labels.en).forEach(add);walk(sourceNotes);walk(c);
          for(const x of a.articles){walk({title:x.title,summary:x.summary,limit:x.limit,prompt:x.prompt});for(const b of x.body.en){add(b.heading);add(b.text);}}
          walk(i);if(rows.length!==360)throw Error('Unexpected source pool');
          await writeFile('/tmp/source-pool.json',JSON.stringify(rows));
          JS
      - name: Restore hash-bound code and translations from repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64,hashlib,json,lzma,os,urllib.request
          from pathlib import Path
          shas=['e7cca3b0d9433ca3ff722186546c864c1893fa59','dc610ce107d4d7fe53b2e34413da27eeb5ecbe1f','e317b20b8b6cc0d2e5e4b94dc89956327113285f','195d0c89a1e30d661eb1e4ceee5b756f896b3ef3','b7437048945b24b0edd8107d010ded66d0b88e31','0c6ec5c5105349ea838ee9ec18b791ff46a2248f','d68a0e46c472c18a5cf102c9704d5eefddef68d7','6e6ae50ccd6c62ac4fc01e6501f4a5af1d22fac0']
          payload=b''
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/OnourImpram/MARSAM/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'MARSAM-source-materializer'})
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              blob=base64.b64decode(data['content']);assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()==sha
              payload+=blob
          assert hashlib.sha256(payload).hexdigest()=='3531c76afa2c46daf1bf902c7bfbbe355a0f741d8ee1d39869bd95e23e33bc30'
          data=json.loads(lzma.decompress(payload));assert data['version']==1
          assert data['baseCommit']=='15e15d87e234feebb9ce262a4a4eb9412e3792a5'
          pool=json.loads(Path('/tmp/source-pool.json').read_text())
          digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
          assert digest(json.dumps(pool,ensure_ascii=False,separators=(',',':')))==data['sourcePoolSHA256']
          allowed={'DELIVERY_STATUS.md','README.md','docs/LOCALE_EXPANSION_TR.md','package.json','public/app.js','public/site.css','scripts/build.mjs','src/articles.mjs','src/content.mjs','src/i18n.mjs','src/info.mjs','src/languages.mjs','src/lib.mjs','src/regional.mjs','src/site.mjs','src/translate.mjs','tests/browser_check.py','tests/browser_e2e.py','tests/build.test.mjs','tests/core.test.mjs','tests/locales.test.mjs'}
          assert {u['path'] for u in data['updates']}==allowed
          assert len(data['updates'])==len(allowed)
          for u in data['updates']:
              p=Path(u['path'])
              if 'content' in u:
                  assert not p.exists(),p
                  text=u['content']
              else:
                  text=p.read_text();assert digest(text)==u['baseSha256'],str(p)+' base hash'
                  if 'replaceAll' in u:
                      for before,after in u['replaceAll']:text=text.replace(before,after)
                      text+=u['append']
                  else:
                      for start,end,replacement in reversed(u['edits']):
                          assert 0<=start<=end<=len(text)
                          text=text[:start]+replacement+text[end:]
              assert digest(text)==u['sha256'],str(p)+' target hash'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for i,source in enumerate(pool):
              for before,after in data['keyReplacements']:source=source.replace(before,after)
              pool[i]=source
          assert len(data['localeRows'])==360 and sorted(data['keyOrder'])==list(range(360))
          for col,locale in enumerate(['ar','id','ms']):
              translations={pool[i]:data['localeRows'][i][col] for i in data['keyOrder']}
              record={'locale':locale,'review':'AI_ASSISTED_DRAFT','humanReviewed':False,'translations':translations}
              text=json.dumps(record,ensure_ascii=False,indent=2)+'\n';assert digest(text)==data['localeHashes'][locale]
              p=Path('src/locales')/(locale+'.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              allowed.add(str(p))
          Path('/tmp/changed-paths.json').write_text(json.dumps(sorted(allowed)))
          print('Restored 24 allowlisted files with exact SHA-256 validation. No external research records or private data.')
          PY
      - name: Content and root/subpath link tests
        run: |
          mkdir -p verification
          npm run check 2>&1 | tee verification/check-root.log
          BASE_PATH=/MARSAM/ npm run check 2>&1 | tee verification/check-subpath.log
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live HTTP browser verification
        run: python tests/browser_e2e.py
      - name: Commit verified preview to feature branch only
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/multilingual-knowledge-platform | cut -f1)" = "$EXPECTED_COMMIT"
          python <<'PY'
          import json,subprocess
          from pathlib import Path
          for p in json.loads(Path('/tmp/changed-paths.json').read_text()):subprocess.run(['git','add','--',p],check=True)
          subprocess.run(['git','add','verification/live-browser.json'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Arabic RTL, Indonesian and Malay with verified eight-language preview [skip ci]'
          git push origin HEAD:refs/heads/feat/multilingual-knowledge-platform
      - name: Package verified source and evidence
        if: always()
        run: |
          mkdir -p /tmp/marsam-eight
          git archive HEAD -o /tmp/marsam-eight/source.tar
          if [ -d dist ]; then cp -r dist /tmp/marsam-eight/dist; fi
          if [ -d verification ]; then cp -r verification /tmp/marsam-eight/verification; fi
          if [ -d .browser-results/live ]; then cp -r .browser-results/live /tmp/marsam-eight/screenshots; fi
          git rev-parse HEAD > /tmp/marsam-eight/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-eight-language-preview
          path: /tmp/marsam-eight/
          retention-days: 14
