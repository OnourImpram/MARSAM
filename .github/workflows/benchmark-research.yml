name: Institutional website research
on:
  push:
    branches: [feat/multilingual-knowledge-platform]
    paths: [.github/workflows/benchmark-research.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright requests beautifulsoup4 && python -m playwright install --with-deps chromium
      - name: Read the specified public sites only
        run: |
          mkdir -p benchmark-evidence
          python - <<'PY'
          import json, pathlib, requests, zipfile, io
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('benchmark-evidence'); report=[]
          targets={
            'harvard-home':'https://hfh.fas.harvard.edu/',
            'harvard-publications':'https://hfh.fas.harvard.edu/publications',
            'duke-home':'https://spiritualityandhealth.duke.edu/',
            'duke-manuals':'https://spiritualityandhealth.duke.edu/index.php/religious-cbt-study/therapy-manuals/',
            'smbi-home':'https://spiritualitymindbody.tc.columbia.edu/',
            'smbi-work':'https://spiritualitymindbody.tc.columbia.edu/our-work/',
            'iapr-home':'https://www.iaprweb.org/',
            'iapr-journal':'https://www.iaprweb.org/journal/'
          }
          with sync_playwright() as p:
            b=p.chromium.launch()
            for name,url in targets.items():
              page=b.new_page(viewport={'width':1440,'height':1000})
              entry={'name':name,'url':url}
              try:
                response=page.goto(url,wait_until='domcontentloaded',timeout=45000)
                page.wait_for_timeout(2500)
                entry.update({'status':response.status,'title':page.title(),'h1':page.locator('h1').all_text_contents(),'links':page.locator('a[href]').count(),'scripts':page.locator('script[src]').count(),'iframes':page.locator('iframe').count()})
                page.screenshot(path=str(out/(name+'-desktop.png')),full_page=True)
                if name.endswith('home'):
                  page.set_viewport_size({'width':390,'height':844});page.wait_for_timeout(500)
                  entry['mobile_overflow']=page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                  page.screenshot(path=str(out/(name+'-mobile.png')),full_page=True)
              except Exception as e:entry['error']=str(e)
              page.close();report.append(entry)
            b.close()
          (out/'observations.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          page_url='https://isletme.marmara.edu.tr/fakulte/kurumsal-logo'
          r=requests.get(page_url,timeout=40);r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          assets=[]
          for a in soup.select('a[href]'):
            u=urljoin(page_url,a['href'])
            if urlparse(u).hostname and urlparse(u).hostname.endswith('.marmara.edu.tr') and ('.zip' in u.lower() or 'Kurumsal_Logo_Kullanim_Kilavuzu.pdf' in u):assets.append(u)
          inventories=[]
          for i,u in enumerate(dict.fromkeys(assets)):
            try:
              rr=requests.get(u,timeout=60);rr.raise_for_status()
              if '.zip' in u.lower():
                z=zipfile.ZipFile(io.BytesIO(rr.content));inventories.append({'url':u,'names':z.namelist()})
                for j,n in enumerate(z.namelist()):
                  if n.lower().endswith('.png'):
                    (out/f'marmara-asset-{i}-{j}.png').write_bytes(z.read(n))
                (out/f'marmara-assets-{i}.zip').write_bytes(rr.content)
              else:(out/'Marmara-logo-guide.pdf').write_bytes(rr.content)
            except Exception as e:inventories.append({'url':u,'error':str(e)})
          (out/'marmara-assets.json').write_text(json.dumps(inventories,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-benchmark-evidence
          path: benchmark-evidence
          retention-days: 7
