name: Inspect current scholarly platform
on:
  push:
    branches: [audit/scholarly-refinement-20261004]
    paths: [.github/workflows/research-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          persist-credentials: false
      - name: Export exact pre-change source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p inspection
          git archive --format=tar 992a29bcefd350f54342d388b86c1f98e13bd212 > inspection/source.tar
          git log -25 --format='%H %ad %s' --date=iso > inspection/recent-commits.txt
          git ls-tree -r 992a29bcefd350f54342d388b86c1f98e13bd212 > inspection/source-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marsam-current-source-992a29b
          path: inspection/
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline source and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATH=/ npm run check > inspection/baseline-root.log
          BASE_PATH=/MARSAM/ PAGES_PREVIEW=true npm run check > inspection/baseline-pages.log
          node scripts/budget.mjs > inspection/baseline-budget.json
      - name: Inspect every current public manifest entry
        run: |
          python - <<'PY'
          import json,hashlib,time
          from pathlib import Path
          from urllib.request import urlopen,Request
          from concurrent.futures import ThreadPoolExecutor
          root='https://onourimpram.github.io/MARSAM/'
          out=Path('inspection/live');out.mkdir(parents=True,exist_ok=True)
          def fetch(path):
              with urlopen(Request(root+path,headers={'User-Agent':'MARSAM-owner-requested-audit'}),timeout=35) as r:return r.status,r.read()
          _,data=fetch('release.json');m=json.loads(data);(out/'release.json').write_bytes(data)
          def check(item):
              path,meta=item
              if path=='.nojekyll':return {'path':path,'skipped':'hosting marker'}
              failures=[]
              for attempt in range(3):
                  try:
                      status,data=fetch(path)
                      ok=hashlib.sha256(data).hexdigest()==meta['sha256']
                      if path.endswith(('.html','.css','.json','.js','.svg')):
                          p=out/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                      return {'path':path,'status':status,'hashMatches':ok,'priorFailures':failures}
                  except Exception as e:failures.append(str(e));time.sleep(1)
              return {'path':path,'error':failures}
          with ThreadPoolExecutor(max_workers=10) as pool:receipts=list(pool.map(check,m['files'].items()))
          Path('inspection/live-route-audit.json').write_text(json.dumps({'release':m['version'],'source':m['sourceCommit'],'checks':receipts},indent=2))
          print('Public audit',m['version'],len(receipts),'failures',sum(bool(x.get('error')) or x.get('hashMatches') is False for x in receipts))
          PY
      - name: Prepare actual browsers and script coverage
        run: |
          python -m pip install -q playwright==1.61.0
          python scripts/test-fonts.py
      - name: Inspect live representative layouts and all home languages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('inspection/screenshots');out.mkdir(exist_ok=True)
          checks=[]
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1440,'height':1050})
              targets=[('tr',''),('tr','evidence/'),('tr','founder/'),('tr','measures/'),('tr','research/'),('tr','library/'),('tr','about/'),('tr','governance/')]+[(l,'') for l in ['en','de','zh','ru','ar','id','ms']]
              for l,path in targets:
                  r=page.goto('https://onourimpram.github.io/MARSAM/'+l+'/'+path,wait_until='load')
                  page.evaluate('document.fonts.ready')
                  page.screenshot(path=str(out/(l+'-'+(path.strip('/') or 'home')+'.png')),full_page=True)
                  checks.append({'locale':l,'path':path,'http':r.status,'title':page.title(),'overflow':page.evaluate('document.documentElement.scrollWidth>innerWidth+1')})
              page.set_viewport_size({'width':390,'height':900})
              for l in ['tr','ar','zh']:
                  page.goto('https://onourimpram.github.io/MARSAM/'+l+'/',wait_until='load')
                  page.screenshot(path=str(out/(l+'-mobile.png')),full_page=True)
              b.close()
          Path('inspection/live-browser.json').write_text(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-current-live-inspection
          path: inspection/
          retention-days: 14
