name: Verify live typography with CJK fonts
on:
  push:
    branches: [design/editorial-finish-20261001]
    paths: [.github/workflows/editorial-script-check.yml]
permissions:
  contents: read
env:
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
  SOURCE_COMMIT: 1795948e7a903f747711028e71603fa00536a16c
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install script fonts in the verification runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-cache -f
          mkdir -p verification
          fc-match 'Noto Serif CJK SC' > verification/editorial-font-environment.txt
          grep -q 'CJK' verification/editorial-font-environment.txt
      - name: Prepare real browser and route manifest
        run: |
          npm run build
          python -m pip install -q playwright==1.57.0
          python -m playwright install chromium
      - name: Require the exact public release before visual verification
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            if curl -fsS --max-time 12 "https://onourimpram.github.io/MARSAM/release.json?source=$SOURCE_COMMIT" > /tmp/release.json; then
              if python -c "import json,os;assert json.load(open('/tmp/release.json'))['sourceCommit']==os.environ['SOURCE_COMMIT']"; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
      - name: Verify every supported script with real glyphs and native interactions
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        run: python tests/design_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-editorial-live-typography
          path: |
            verification/editorial-browser.json
            verification/editorial-font-environment.txt
            .browser-results/editorial/
          include-hidden-files: true
          retention-days: 7
