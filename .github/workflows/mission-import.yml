name: Verify MARSAM evidence continuity candidate
on:
  push:
    branches: [research/evidence-continuity-20261004]
    paths: [.github/workflows/mission-import.yml]
permissions:
  contents: write
concurrency:
  group: marsam-evidence-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 18
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact locally reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p verification
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          parts=sorted(pathlib.Path('.github/mission-import').glob('payload.*'))
          assert len(parts)==7
          encoded=''.join(p.read_text().strip() for p in parts)
          assert len(encoded)==73916,len(encoded)
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(patch).hexdigest()
          assert digest=='17ed1c34ebc1081d58111a0ff102c7e6bbead468625c755c1bfd99640cc3642f',digest
          path=pathlib.Path('/tmp/marsam-evidence-cycle.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          pathlib.Path('verification/candidate-patch-sha256.txt').write_text(digest+'\n')
          print('Exact patch verified and applied',digest)
          PY
      - name: Run source and generated-route contracts at both roots
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATH=/ npm run check > verification/candidate-root.log 2>&1
          BASE_PATH=/MARSAM/ PAGES_PREVIEW=true npm run check > verification/candidate-pages.log 2>&1
          node scripts/budget.mjs > verification/candidate-budget.log
          python - <<'PY'
          import json,hashlib,pathlib
          for path,expected in json.loads(pathlib.Path('docs/cycles/2026-10-04/PRESERVED_VISUALS.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==expected,path
          print('Approved CSS and portal bytes unchanged')
          PY
      - name: Prepare matching engines and notebook environment
        run: |
          python -m pip install --timeout 25 -q playwright==1.61.0 nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.30.1
          python scripts/test-fonts.py
      - name: Execute notebook and all seven real browser suites
        shell: bash
        run: |
          set -euo pipefail
          python tests/research_artifacts.py > verification/candidate-artifacts.log 2>&1
          python tests/browser_e2e.py > verification/candidate-core.log 2>&1 & core=$!
          python tests/scope_e2e.py > verification/candidate-scope.log 2>&1 & scope=$!
          python tests/heritage_e2e.py > verification/candidate-layout.log 2>&1 & layout=$!
          timeout 420 python -u tests/research_e2e.py > verification/candidate-research.log 2>&1 & research=$!
          python tests/cini_e2e.py > verification/candidate-cini.log 2>&1 & cini=$!
          python tests/scholarship_e2e.py > verification/candidate-scholarship.log 2>&1 & scholarship=$!
          python tests/evidence_cycle_e2e.py > verification/candidate-evidence-cycle.log 2>&1 & cycle=$!
          status=0
          for pid in $core $scope $layout $research $cini $scholarship $cycle; do wait "$pid" || status=1; done
          for log in verification/candidate-*.log; do echo "$log"; tail -12 "$log"; done
          exit "$status"
      - name: Commit only the verified candidate and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onour Impram'
          git config user.email 'onuribram@outlook.com'
          rm -rf .github/mission-import
          rm .github/workflows/mission-import.yml
          git add README.md DELIVERY_STATUS.md .github/workflows/verify-preview.yml docs/cycles/2026-10-04 docs/research/SCOPE_AUDIT.json docs/superpowers/plans/2026-10-04-evidence-continuity.md package.json scripts/build.mjs src tests .github/mission-import .github/workflows/mission-import.yml
          # Raw RED output is evidence, not code formatting. Do not rewrite it.
          git diff --cached --check -- . ':!docs/cycles/2026-10-04/*.log'
          git commit -m 'feat: strengthen plural evidence and persisted multilingual draft continuity for MARSAM 0.10.0'
          git push origin HEAD:research/evidence-continuity-20261004
          git rev-parse HEAD > verification/candidate-source-sha.txt
          git archive --format=tar --output=verification/candidate-source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-evidence-candidate
          path: |
            verification/candidate-*
            verification/reading-room-*.json
            verification/research-*.json
            verification/cini-*.json
            verification/scholarship-*.json
            verification/evidence-cycle-*.json
            .browser-results/evidence-cycle/
          include-hidden-files: true
          retention-days: 14
