name: Finish verified MARSAM notice cleanup
on:
  push:
    branches: [fix/editorial-notice-cleanup-0102]
    paths: [.github/workflows/notice-cleanup-recover.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 8
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the existing browser environment
        run: |
          python -m pip install -q PyYAML playwright==1.61.0
          python scripts/test-fonts.py
      - name: Reapply the identical tested website change and repair only the test environment
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p verification/notice-cleanup
          python - <<'PY'
          import yaml,subprocess,hashlib
          from pathlib import Path
          original=yaml.safe_load(Path('.github/workflows/notice-cleanup.yml').read_text())
          script=next(s['run'] for s in original['jobs']['verify']['steps'] if s.get('name')=='Remove repeated generic notices at the source')
          subprocess.run(['bash','-e','-u','-o','pipefail','-c',script],check=True)
          Path('verification/notice-cleanup/identical-patch-sha256.txt').write_text(hashlib.sha256(script.encode()).hexdigest())
          p=Path('tests/notice_cleanup_e2e.py');s=p.read_text()
          assert 'import json,os,time,subprocess,urllib.request' in s
          assert 'getattr(pw,engine).launch()' in s
          s=s.replace('import json,os,time,subprocess,urllib.request','import json,os,pwd,time,subprocess,urllib.request')
          s=s.replace('getattr(pw,engine).launch()','getattr(pw,engine).launch(env={**os.environ,"HOME":pwd.getpwuid(os.getuid()).pw_dir})')
          p.write_text(s)
          p=Path('docs/design/NOTICE_CLEANUP_0_10_2.md')
          p.write_text(p.read_text()+'\nVerification record. Run 37228594596 passed both full source/build suites, all eight existing browser suites and notebook checks. The additional notice test completed Chromium but Firefox could not launch because the container HOME belonged to another user. The fixture now uses the current user’s owned home, as the existing browser fixtures do. No browser safeguard or website assertion was disabled. The identical website patch is reused, and all three engines run the corrected notice fixture here.\n')
          PY
      - name: Recheck complete source and build contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATH=/ npm run check > verification/notice-cleanup/root.log 2>&1
          BASE_PATH=/MARSAM/ PAGES_PREVIEW=true npm run check > verification/notice-cleanup/pages.log 2>&1
      - name: All three engines verify cleaned notices and preserved portal
        shell: bash
        run: |
          set -euo pipefail
          python tests/notice_cleanup_e2e.py > verification/notice-cleanup/browser.log 2>&1 & notices=$!
          python tests/portal_pixels.py > verification/notice-cleanup/portal.log 2>&1 & portal=$!
          status=0
          wait "$notices" || status=1
          wait "$portal" || status=1
          cat verification/notice-cleanup/browser.log
          tail -3 verification/notice-cleanup/portal.log
          exit "$status"
      - name: Commit verified content without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onour Impram'
          git config user.email 'onuribram@outlook.com'
          git add src/chrome.mjs src/site.mjs src/i18n.mjs public/site.css src/release.mjs package.json AGENTS.md README.md docs/design/NOTICE_CLEANUP_0_10_2.md tests/notice_cleanup_e2e.py
          git diff --cached --check
          git commit -m 'fix: remove repetitive blanket notices across all eight MARSAM editions'
          git push origin HEAD:fix/editorial-notice-cleanup-0102
          git rev-parse HEAD > verification/notice-cleanup/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-cleanup-0102-complete
          path: verification/notice-cleanup/
          retention-days: 7
